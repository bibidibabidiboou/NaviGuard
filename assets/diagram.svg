<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%" style="background:#1e1e24; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d8ee8" />
      <stop offset="100%" stop-color="#1f58a8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cc96f" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f85149" />
      <stop offset="100%" stop-color="#b62324" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Title / Tagline -->
  <text x="30" y="38" fill="#58a6ff" font-size="14" font-weight="700" letter-spacing="1">NETWORK TOPOLOGY • ZERO CONFIGURATION</text>
  <text x="30" y="65" fill="#f0f6fc" font-size="20" font-weight="600">Air-Gapped Console Isolation &amp; Connection Test Emulation</text>

  <!-- Connection line: Home Router to PC -->
  <line x1="140" y1="180" x2="250" y2="180" stroke="#388bfd" stroke-width="2" stroke-dasharray="6,4" />
  <text x="195" y="170" fill="#8b949e" font-size="11" text-anchor="middle">Normal Wi-Fi</text>

  <!-- Node 1: Home Router / Internet -->
  <g transform="translate(40, 120)" filter="url(#shadow)">
    <rect width="100" height="120" rx="10" fill="#2d333b" stroke="#444c56" stroke-width="1.5" />
    <circle cx="50" cy="40" r="18" fill="#30363d" />
    <path d="M43 45 A 10 10 0 0 1 57 45 M39 41 A 15 15 0 0 1 61 41 M35 37 A 20 20 0 0 1 65 37 M50 48 A 2 2 0 1 1 50 49" stroke="#58a6ff" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="50" y="78" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle">Home</text>
    <text x="50" y="96" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle">Router</text>
    <text x="50" y="112" fill="#58a6ff" font-size="10" text-anchor="middle">Internet OK</text>
  </g>

  <!-- Connection line: PC to Spare Router -->
  <line x1="450" y1="180" x2="520" y2="180" stroke="#4cc96f" stroke-width="3" />
  <text x="485" y="170" fill="#7ee787" font-size="11" font-weight="600" text-anchor="middle">Ethernet</text>

  <!-- Node 2: PC with NaviGuard -->
  <g transform="translate(250, 100)" filter="url(#shadow)">
    <rect width="200" height="160" rx="12" fill="#161b22" stroke="#388bfd" stroke-width="2" />
    <rect x="0" y="0" width="200" height="32" rx="12" fill="url(#blueGrad)" />
    <text x="100" y="21" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">PC (NaviGuard Running)</text>
    
    <rect x="15" y="44" width="170" height="30" rx="6" fill="#21262d" />
    <text x="25" y="63" fill="#7ee787" font-size="11">✓ Built-in DHCP Server</text>
    
    <rect x="15" y="80" width="170" height="30" rx="6" fill="#21262d" />
    <text x="25" y="99" fill="#7ee787" font-size="11">✓ Local DNS Sinkhole</text>
    
    <rect x="15" y="116" width="170" height="34" rx="6" fill="#21262d" />
    <text x="25" y="131" fill="#58a6ff" font-size="10" font-weight="600">✓ Fake Connection Test</text>
    <text x="25" y="144" fill="#8b949e" font-size="9">(Answers ctest HTTP on :80)</text>
  </g>

  <!-- Connection line: Spare Router to Switch -->
  <line x1="650" y1="180" x2="740" y2="180" stroke="#388bfd" stroke-width="2" stroke-dasharray="6,4" />
  <text x="695" y="170" fill="#8b949e" font-size="11" text-anchor="middle">Isolated Wi-Fi</text>

  <!-- Node 3: Spare Router -->
  <g transform="translate(520, 110)" filter="url(#shadow)">
    <rect width="130" height="140" rx="10" fill="#2d333b" stroke="#e3b341" stroke-width="1.5" />
    <circle cx="65" cy="38" r="18" fill="#30363d" />
    <path d="M58 43 A 10 10 0 0 1 72 43 M54 39 A 15 15 0 0 1 76 39 M50 35 A 20 20 0 0 1 80 35 M65 46 A 2 2 0 1 1 65 47" stroke="#e3b341" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="65" y="76" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="middle">Spare Router</text>
    <text x="65" y="94" fill="#f85149" font-size="11" font-weight="600" text-anchor="middle">WAN port: EMPTY</text>
    <text x="65" y="112" fill="#8b949e" font-size="10" text-anchor="middle">DHCP: Disabled</text>
    <text x="65" y="126" fill="#7ee787" font-size="10" text-anchor="middle">No Direct Internet</text>
  </g>

  <!-- Node 4: Switch / Switch 2 -->
  <g transform="translate(740, 110)" filter="url(#shadow)">
    <rect width="140" height="140" rx="10" fill="#161b22" stroke="#4cc96f" stroke-width="2" />
    <rect x="0" y="0" width="140" height="28" rx="10" fill="url(#greenGrad)" />
    <text x="70" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Switch 2 / Switch 1</text>
    
    <text x="70" y="52" fill="#7ee787" font-size="12" font-weight="700" text-anchor="middle">"Connected"</text>
    <text x="70" y="68" fill="#8b949e" font-size="10" text-anchor="middle">Passes Network Test</text>
    
    <line x1="15" y1="78" x2="125" y2="78" stroke="#30363d" stroke-width="1" />
    
    <text x="70" y="96" fill="#f85149" font-size="11" font-weight="600" text-anchor="middle">🚫 Super Nag Gone</text>
    <text x="70" y="112" fill="#f85149" font-size="11" font-weight="600" text-anchor="middle">🚫 Telemetry Cut</text>
    <text x="70" y="128" fill="#58a6ff" font-size="10" text-anchor="middle">Zero typing needed</text>
  </g>

  <!-- Bottom banner badge -->
  <g transform="translate(180, 290)">
    <rect width="560" height="32" rx="16" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="280" y="21" fill="#c9d1d9" font-size="12" font-weight="500" text-anchor="middle">
      <tspan fill="#7ee787">● 100% Offline Security</tspan>
      <tspan fill="#8b949e">  |  </tspan>
      <tspan fill="#58a6ff">● Self-Hosted on Windows</tspan>
      <tspan fill="#8b949e">  |  </tspan>
      <tspan fill="#f85149">● No Public DNS Dependency</tspan>
    </text>
  </g>
</svg>

